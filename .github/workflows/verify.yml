name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile sources
        run: python -m compileall -q orbit orbitcli orbitcli_android agent page_executor templates tools utils_mobile
      - name: Run tests
        run: python -m pytest tests -q
